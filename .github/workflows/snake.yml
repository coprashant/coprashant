name: Generate Snake Animation

on:
  schedule:
    # Runs automatically every midnight UTC
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23790eae&color_dots=%23ebedf0,%23e4d4f8,%23c094f0,%23954ded,%23520b8c
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23954ded&color_dots=%23161b22,%233c1d63,%236224a1,%238e3fde,%23b266f0

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
